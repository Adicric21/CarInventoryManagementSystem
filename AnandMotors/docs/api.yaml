api: 3.1.0
info:
  title: Car Dealership Inventory API
  version: 0.1.0
  description: |
    Authentication and protected vehicle-catalogue API for the car dealership application.
    Registration and login are public; vehicle operations use the `bearerAuth` JWT security scheme.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Authentication
  - name: Vehicles
  - name: Low Stock
  - name: Inventory Activity
  - name: Purchase History
  - name: Dashboard
  - name: Vehicle CSV
paths:
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a user
      description: |
        Creates a USER account. Name and email are normalized before persistence. Public
        registration never creates an ADMIN account; any client-supplied role is ignored.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
            example:
              name: Mahadev
              email: Mahadev@Example.com
              password: StrongPassword123
      responses:
        '201':
          description: User registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/EmailAlreadyExistsError'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Log in
      description: Validates credentials and returns a short-lived JWT access token.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: StrongPassword123
      responses:
        '200':
          description: Credentials accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentialsError'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /api/vehicles:
    get:
      tags:
        - Vehicles
      summary: List vehicles
      description: |
        Returns a deterministic, paginated vehicle list ordered by creation time descending.
        Unrecognized query parameters are rejected. Available to authenticated USER and ADMIN
        accounts.
      operationId: listVehicles
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated vehicle list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiclePage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequiredError'
        '500':
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags:
        - Vehicles
      summary: Create a vehicle
      description: Creates a vehicle. Available only to authenticated ADMIN accounts.
      operationId: createVehicle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'
            example:
              make: Toyota
              model: Fortuner
              category: SUV
              price: 3500000
              quantity: 5
      responses:
        '201':
          description: Vehicle created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequiredError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /api/vehicles/search:
    get:
      tags:
        - Vehicles
      summary: Search vehicles
      description: |
        Filters, sorts, and paginates vehicles in the database. Text matching is
        case-insensitive, and unrecognized query parameters are rejected. Available to
        authenticated USER and ADMIN accounts.
      operationId: searchVehicles
      security:
        - bearerAuth: []
      parameters:
        - name: make
          in: query
          description: Case-insensitive partial make match; surrounding whitespace is trimmed.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: model
          in: query
          description: Case-insensitive partial model match; surrounding whitespace is trimmed.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: category
          in: query
          description: Case-insensitive partial category match; surrounding whitespace is trimmed.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: minPrice
          in: query
          description: Inclusive minimum non-negative decimal price.
          schema:
            type: string
            pattern: '^(?:0|[1-9]\d*)(?:\.\d+)?$'
            example: '2500000'
        - name: maxPrice
          in: query
          description: Inclusive maximum non-negative decimal price; must not be less than minPrice.
          schema:
            type: string
            pattern: '^(?:0|[1-9]\d*)(?:\.\d+)?$'
            example: '4000000'
        - name: inStock
          in: query
          description: '`true` matches quantity above zero; `false` matches zero quantity.'
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sortBy
          in: query
          description: Allowlisted field used for database sorting.
          schema:
            type: string
            enum:
              - make
              - model
              - category
              - price
              - quantity
              - createdAt
            default: createdAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        '200':
          description: Paginated vehicles matching all supplied filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiclePage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequiredError'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /api/vehicles/{id}:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    put:
      tags:
        - Vehicles
      summary: Update a vehicle
      description: |
        Partially updates editable vehicle fields. Server-managed identifiers and timestamps
        cannot be changed. Available only to authenticated ADMIN accounts.
      operationId: updateVehicle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVehicleRequest'
            example:
              price: 3600000
              quantity: 4
      responses:
        '200':
          description: Vehicle updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequiredError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/VehicleNotFoundError'
        '500':
          $ref: '#/components/responses/UnexpectedError'
    delete:
      tags:
        - Vehicles
      summary: Delete a vehicle
      description: Deletes an existing vehicle. Available only to authenticated ADMIN accounts.
      operationId: deleteVehicle
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Vehicle deleted; no response body is returned.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequiredError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/VehicleNotFoundError'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /api/vehicles/{id}/purchase:
    post:
      tags:
        - Vehicles
      summary: Purchase vehicle stock
      description: |
        Atomically decreases stock only when the requested quantity is available, preventing
        concurrent purchases from overselling. Available to authenticated USER and ADMIN accounts.
      operationId: purchaseVehicle
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryQuantityRequest'
            example:
              quantity: 1
      responses:
        '200':
          description: Stock purchased; the updated vehicle is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryVehicleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequiredError'
        '404':
          $ref: '#/components/responses/VehicleNotFoundError'
        '409':
          $ref: '#/components/responses/InsufficientStockError'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /api/vehicles/{id}/restock:
    post:
      tags:
        - Vehicles
      summary: Restock vehicle inventory
      description: |
        Atomically increments stock. Available only to authenticated ADMIN accounts.
      operationId: restockVehicle
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryQuantityRequest'
            example:
              quantity: 5
      responses:
        '200':
          description: Stock replenished; the updated vehicle is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryVehicleResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequiredError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/VehicleNotFoundError'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /api/admin/vehicles/low-stock:
    get:
      tags:
        - Low Stock
      summary: List low-stock vehicles
      description: |
        Returns vehicles whose quantity is at or below the server-configured
        LOW_STOCK_THRESHOLD. Out-of-stock vehicles are included. The client cannot override
        the configured threshold. Available only to authenticated ADMIN accounts.
      operationId: listLowStockVehicles
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [quantity, make, model, category]
            default: quantity
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Paginated low-stock and out-of-stock vehicles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiclePage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequiredError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /api/admin/inventory/activities:
    get:
      tags:
        - Inventory Activity
      summary: List inventory activity
      description: |
        Returns the append-only inventory audit history. Filtering, pagination, and sorting
        are performed in PostgreSQL. Vehicle identity snapshots remain available after deletion.
        Activity metadata is intentionally not exposed. Available only to authenticated ADMIN
        accounts.
      operationId: listInventoryActivities
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          schema:
            $ref: '#/components/schemas/InventoryActivityAction'
        - name: vehicleId
          in: query
          schema:
            type: string
            format: uuid
        - name: performedById
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Inclusive ISO 8601 timestamp.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Inclusive ISO 8601 timestamp.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Paginated inventory activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryActivityPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequiredError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /api/purchases/me:
    get:
      tags:
        - Purchase History
      summary: List my purchases
      description: |
        Returns only purchases owned by the authenticated user. Vehicle and price snapshots
        remain available after vehicle changes or deletion. A userId query is rejected.
      operationId: listMyPurchases
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PurchaseMake'
        - $ref: '#/components/parameters/PurchaseModel'
        - $ref: '#/components/parameters/PurchaseFrom'
        - $ref: '#/components/parameters/PurchaseTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/PurchaseSortOrder'
      responses:
        '200':
          description: Paginated purchases belonging to the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasePage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequiredError'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /api/admin/purchases:
    get:
      tags:
        - Purchase History
      summary: List all purchases
      description: |
        Filters and paginates durable purchase records in PostgreSQL. Available only to
        authenticated ADMIN accounts.
      operationId: listAdminPurchases
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
        - name: vehicleId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PurchaseMake'
        - $ref: '#/components/parameters/PurchaseModel'
        - $ref: '#/components/parameters/PurchaseFrom'
        - $ref: '#/components/parameters/PurchaseTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/PurchaseSortOrder'
      responses:
        '200':
          description: Paginated purchases across all users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasePage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequiredError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /api/admin/dashboard:
    get:
      tags:
        - Dashboard
      summary: Get administrator analytics
      description: |
        Returns current inventory totals plus purchase metrics for a controlled period.
        Low-stock calculations use the server-configured threshold and money values are
        exact decimal strings. Available only to authenticated ADMIN accounts.
      operationId: getAdminDashboard
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
      responses:
        '200':
          description: Inventory and purchase analytics.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DashboardData'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequiredError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /api/admin/vehicles/import/preview:
    post:
      tags:
        - Vehicle CSV
      summary: Preview a vehicle CSV
      description: |
        Parses and validates an in-memory CSV without writing to the database. The `file`
        field must be a `.csv` file no larger than 2 MB with at most 1,000 data rows.
      operationId: previewVehicleCsv
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: CSV validation summary and row errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleCsvPreviewResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequiredError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/admin/vehicles/import:
    post:
      tags:
        - Vehicle CSV
      summary: Import a vehicle CSV
      description: |
        Re-parses and validates the upload, then creates all vehicles and VEHICLE_CREATED
        activities in one transaction. Any invalid row or persistence failure imports nothing.
      operationId: importVehicleCsv
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      imported:
                        type: integer
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationRequiredError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/admin/vehicles/export:
    get:
      tags:
        - Vehicle CSV
      summary: Export vehicle inventory
      description: |
        Returns make, model, category, price, and quantity in deterministic order. CSV
        metacharacters are quoted and spreadsheet formula prefixes are neutralized.
      operationId: exportVehicleCsv
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Vehicle inventory CSV attachment.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="vehicles-2026-07-23.csv"
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/AuthenticationRequiredError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Send the login access token as `Authorization: Bearer <access-token>`.'
  parameters:
    VehicleId:
      name: id
      in: path
      required: true
      description: Server-generated vehicle identifier.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        maximum: 9007199254740991
        default: 1
    Limit:
      name: limit
      in: query
      description: Number of vehicles per page, capped at 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    PurchaseMake:
      name: make
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 100
    PurchaseModel:
      name: model
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 100
    PurchaseFrom:
      name: from
      in: query
      description: Inclusive ISO 8601 timestamp.
      schema:
        type: string
        format: date-time
    PurchaseTo:
      name: to
      in: query
      description: Inclusive ISO 8601 timestamp.
      schema:
        type: string
        format: date-time
    PurchaseSortOrder:
      name: sortOrder
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
  schemas:
    VehicleCsvPreviewResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [headers, totalRows, validRows, invalidRows, rows, errors]
          properties:
            headers:
              type: array
              items:
                type: string
            totalRows:
              type: integer
            validRows:
              type: integer
            invalidRows:
              type: integer
            rows:
              type: array
              items:
                type: object
                required: [row, make, model, category, price, quantity]
                properties:
                  row:
                    type: integer
                  make:
                    type: string
                  model:
                    type: string
                  category:
                    type: string
                  price:
                    type: string
                  quantity:
                    type: integer
            errors:
              type: array
              items:
                type: object
                required: [row, field, code, message]
                properties:
                  row:
                    type: integer
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
    DashboardData:
      type: object
      additionalProperties: false
      required:
        - summary
        - vehiclesByCategory
        - purchasesByDay
        - topPurchasedVehicles
        - recentActivities
      properties:
        summary:
          type: object
          required:
            - vehicleCount
            - totalStockUnits
            - inventoryValue
            - lowStockCount
            - outOfStockCount
            - purchaseCount
            - unitsPurchased
            - purchaseRevenue
          properties:
            vehicleCount:
              type: integer
            totalStockUnits:
              type: integer
            inventoryValue:
              type: string
            lowStockCount:
              type: integer
            outOfStockCount:
              type: integer
            purchaseCount:
              type: integer
            unitsPurchased:
              type: integer
            purchaseRevenue:
              type: string
        vehiclesByCategory:
          type: array
          items:
            type: object
            required: [category, vehicleCount, stockUnits]
            properties:
              category:
                type: string
              vehicleCount:
                type: integer
              stockUnits:
                type: integer
        purchasesByDay:
          type: array
          items:
            type: object
            required: [date, purchaseCount, unitsPurchased, revenue]
            properties:
              date:
                type: string
                format: date
              purchaseCount:
                type: integer
              unitsPurchased:
                type: integer
              revenue:
                type: string
        topPurchasedVehicles:
          type: array
          items:
            type: object
            required: [vehicleMake, vehicleModel, unitsPurchased, revenue]
            properties:
              vehicleMake:
                type: string
              vehicleModel:
                type: string
              unitsPurchased:
                type: integer
              revenue:
                type: string
        recentActivities:
          type: array
          items:
            $ref: '#/components/schemas/InventoryActivity'
    PurchaseActor:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
    Purchase:
      type: object
      additionalProperties: false
      required:
        - id
        - vehicleId
        - vehicleMake
        - vehicleModel
        - vehicleCategory
        - unitPrice
        - quantity
        - totalAmount
        - purchasedAt
        - purchasedBy
      properties:
        id:
          type: string
          format: uuid
        vehicleId:
          type: [string, 'null']
          format: uuid
        vehicleMake:
          type: string
        vehicleModel:
          type: string
        vehicleCategory:
          type: string
        unitPrice:
          type: string
          pattern: '^\d+\.\d{2}$'
        quantity:
          type: integer
          minimum: 1
        totalAmount:
          type: string
          pattern: '^\d+\.\d{2}$'
        purchasedAt:
          type: string
          format: date-time
        purchasedBy:
          $ref: '#/components/schemas/PurchaseActor'
    PurchasePage:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Purchase'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    InventoryActivityAction:
      type: string
      enum:
        - VEHICLE_CREATED
        - VEHICLE_UPDATED
        - VEHICLE_DELETED
        - VEHICLE_PURCHASED
        - VEHICLE_RESTOCKED
    InventoryActivityActor:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
    InventoryActivity:
      type: object
      additionalProperties: false
      required:
        - id
        - action
        - vehicleId
        - vehicleMake
        - vehicleModel
        - vehicleCategory
        - quantityBefore
        - quantityChange
        - quantityAfter
        - performedBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/InventoryActivityAction'
        vehicleId:
          type: [string, 'null']
          format: uuid
        vehicleMake:
          type: string
        vehicleModel:
          type: string
        vehicleCategory:
          type: string
        quantityBefore:
          type: [integer, 'null']
        quantityChange:
          type: [integer, 'null']
        quantityAfter:
          type: [integer, 'null']
        performedBy:
          $ref: '#/components/schemas/InventoryActivityActor'
        createdAt:
          type: string
          format: date-time
    InventoryActivityPage:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InventoryActivity'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    UserRole:
      type: string
      enum:
        - USER
        - ADMIN
    PublicUser:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - role
      properties:
        id:
          type: string
          example: user-0001
        name:
          type: string
          example: Mahadev
        email:
          type: string
          format: email
          example: mahadev@example.com
        role:
          $ref: '#/components/schemas/UserRole'
    RegistrationRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed before persistence and must not be blank.
        email:
          type: string
          format: email
          description: Trimmed and converted to lowercase.
        password:
          type: string
          format: password
          minLength: 8
          description: |
            Must contain at least one uppercase letter, lowercase letter, and number, and must
            not exceed bcrypt's 72 UTF-8 byte input limit.
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Trimmed and converted to lowercase.
        password:
          type: string
          format: password
          minLength: 1
          description: Must not exceed bcrypt's 72 UTF-8 byte input limit.
    RegistrationResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - user
          properties:
            user:
              $ref: '#/components/schemas/PublicUser'
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - accessToken
            - user
          properties:
            accessToken:
              type: string
              minLength: 1
              description: Signed JWT access token.
              example: jwt-access-token
            user:
              $ref: '#/components/schemas/PublicUser'
    Vehicle:
      type: object
      additionalProperties: false
      required:
        - id
        - make
        - model
        - category
        - price
        - quantity
        - stockStatus
        - isLowStock
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        make:
          type: string
          minLength: 1
          maxLength: 100
          example: Toyota
        model:
          type: string
          minLength: 1
          maxLength: 100
          example: Fortuner
        category:
          type: string
          minLength: 1
          maxLength: 100
          example: SUV
        price:
          type: number
          exclusiveMinimum: 0
          maximum: 999999999999.99
          multipleOf: 0.01
          description: Decimal-backed persisted price serialized as a JSON number.
          example: 3500000
        quantity:
          type: integer
          minimum: 0
          maximum: 2147483647
          example: 5
        stockStatus:
          type: string
          enum: [OUT_OF_STOCK, LOW_STOCK, IN_STOCK]
          description: Server-derived status using the configured low-stock threshold.
        isLowStock:
          type: boolean
          description: True for LOW_STOCK and OUT_OF_STOCK vehicles.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateVehicleRequest:
      type: object
      additionalProperties: false
      required:
        - make
        - model
        - category
        - price
        - quantity
      properties:
        make:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed, must not be blank, and cannot exceed 100 characters.
        model:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed, must not be blank, and cannot exceed 100 characters.
        category:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed, must not be blank, and cannot exceed 100 characters.
        price:
          type: number
          exclusiveMinimum: 0
          maximum: 999999999999.99
          multipleOf: 0.01
          description: Supports at most two decimal places.
        quantity:
          type: integer
          minimum: 0
          maximum: 2147483647
    UpdateVehicleRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        make:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed, must not be blank, and cannot exceed 100 characters.
        model:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed, must not be blank, and cannot exceed 100 characters.
        category:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed, must not be blank, and cannot exceed 100 characters.
        price:
          type: number
          exclusiveMinimum: 0
          maximum: 999999999999.99
          multipleOf: 0.01
          description: Supports at most two decimal places.
        quantity:
          type: integer
          minimum: 0
          maximum: 2147483647
    VehicleResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - vehicle
          properties:
            vehicle:
              $ref: '#/components/schemas/Vehicle'
    InventoryQuantityRequest:
      type: object
      additionalProperties: false
      required:
        - quantity
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Required positive integer; numeric strings are not accepted.
    InventoryVehicleResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Vehicle'
    PaginationMeta:
      type: object
      additionalProperties: false
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    VehiclePage:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    ErrorDetails:
      type: object
      description: Safe structured context. Empty when no client-actionable details apply.
      additionalProperties: true
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
        message:
          type: string
        details:
          $ref: '#/components/schemas/ErrorDetails'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: The request is invalid.
              details:
                fields:
                  email:
                    - Email must be valid.
    AuthenticationRequiredError:
      description: A valid bearer access token is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication is required.
              details: {}
    ForbiddenError:
      description: The authenticated account does not have the required ADMIN role.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: You do not have permission to perform this action.
              details: {}
    VehicleNotFoundError:
      description: No vehicle has the supplied identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VEHICLE_NOT_FOUND
              message: Vehicle not found.
              details: {}
    InsufficientStockError:
      description: The requested purchase quantity exceeds the available vehicle stock.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INSUFFICIENT_STOCK
              message: Requested quantity exceeds available stock.
              details: {}
    EmailAlreadyExistsError:
      description: The normalized email is already registered.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: EMAIL_ALREADY_EXISTS
              message: An account with this email already exists.
              details: {}
    InvalidCredentialsError:
      description: The email or password is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_CREDENTIALS
              message: Invalid email or password.
              details: {}
    UnexpectedError:
      description: An unexpected internal error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNEXPECTED_ERROR
              message: An unexpected error occurred.
              details: {}
